spring.application.name=kpi-simulator-service
server.port=${SERVER_PORT:8088}
spring.datasource.url=jdbc:postgresql://${ADAPTER_DB_HOST:${DB_HOST:localhost}}:${ADAPTER_DB_PORT:${DB_PORT:15432}}/${ADAPTER_DB_NAME:adapter_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

kpi.simulator.enabled=${KPI_SIMULATOR_ENABLED:true}
kpi.simulator.cron=${KPI_SIMULATOR_CRON:10 * * * * *}
kpi.simulator.zone=${KPI_SIMULATOR_ZONE:Asia/Ho_Chi_Minh}
kpi.simulator.clickhouse-url=${CLICKHOUSE_URL:http://localhost:8123}
kpi.simulator.clickhouse-username=${CLICKHOUSE_USER:default}
kpi.simulator.clickhouse-password=${CLICKHOUSE_PASSWORD:clickhousepassword}
