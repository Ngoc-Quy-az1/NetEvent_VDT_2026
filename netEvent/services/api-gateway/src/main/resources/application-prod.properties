server.port=${SERVER_PORT:8000}

# Spring Cloud Gateway Route Configurations (Production - Docker Container Names)
spring.cloud.gateway.routes[0].id=notification-adapter
spring.cloud.gateway.routes[0].uri=http://${ADAPTER_HOST:notification-adapter}:${NOTIFICATION_ADAPTER_PORT:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/events/**,/api/v1/ingest/**

spring.cloud.gateway.routes[1].id=mini-business-service
spring.cloud.gateway.routes[1].uri=http://${MINI_BUSINESS_HOST:mini-business-service}:${MINI_BUSINESS_PORT:8080}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/profiles/**,/api/v1/profile-workflow/**,/api/v1/business-rules/**,/api/v1/templates/**,/api/v1/accounts/**

spring.cloud.gateway.routes[2].id=routing-service
spring.cloud.gateway.routes[2].uri=http://${ROUTING_HOST:routing-service}:${ROUTING_SERVICE_PORT:8082}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/routing/**

spring.cloud.gateway.routes[3].id=audit-service
spring.cloud.gateway.routes[3].uri=http://${AUDIT_HOST:audit-service}:${AUDIT_SERVICE_PORT:8086}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/audit/**

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,gateway
