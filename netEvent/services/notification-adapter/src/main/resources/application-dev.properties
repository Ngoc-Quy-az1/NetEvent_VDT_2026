# Datasource Configuration (PostgreSQL adapter_db - Development)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${ADAPTER_DB_NAME:${INGEST_DB_NAME:adapter_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.table=flyway_schema_history_adapter
spring.flyway.locations=classpath:db/migration

# Kafka Configuration (Development)
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

# Scheduler & Service Integration
scheduler.collect-cron=0 13 * * * *
scheduler.publish-cron=0 * * * * *
mini-business.service.url=http://${MINI_BUSINESS_HOST:localhost}:${MINI_BUSINESS_PORT:8080}
