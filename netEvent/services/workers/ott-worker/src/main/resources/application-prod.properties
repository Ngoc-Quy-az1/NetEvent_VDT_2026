# Database (notification_db - Production)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${NOTIFICATION_DB_NAME:${DELIVERY_DB_NAME:notification_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}

# Kafka (Production)
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka:29092}
spring.kafka.consumer.group-id=ott-worker-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.table=flyway_schema_history_ott
spring.flyway.locations=classpath:db/migration
