# Kafka (Production)
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka:29092}
spring.kafka.consumer.group-id=event-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Database (notification_db - Production)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${NOTIFICATION_DB_NAME:${PROCESSOR_DB_NAME:notification_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.jpa.hibernate.ddl-auto=none
