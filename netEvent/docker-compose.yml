services: 
  postgres:
    image: postgres:15-alpine
    container_name: netevent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_MULTIPLE_DATABASES: adapter_db,notification_db
    ports:
      - "15432:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/database/init/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - netevent-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: netevent-clickhouse
    environment:
      CLICKHOUSE_DB: kpi_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhousepassword
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    command: ["--", "--listen_host=0.0.0.0"]
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/database/init/init-clickhouse.sql:/docker-entrypoint-initdb.d/init-clickhouse.sql
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netevent-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: netevent-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - netevent-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: netevent-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - netevent-network

  redis:
    image: redis:7-alpine
    container_name: netevent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - netevent-network

  mini-business-service:
    build:
      context: .
      dockerfile: services/mini_business-service/Dockerfile
    container_name: netevent-mini-business
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      ADAPTER_DB_NAME: adapter_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      BUSINESS_RULE_CREDENTIAL_ENCRYPTION_KEY: ${BUSINESS_RULE_CREDENTIAL_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - netevent-network
 
  kpi-simulator-service:
    build:
      context: .
      dockerfile: services/kpi-simulator-service/Dockerfile
    container_name: netevent-kpi-simulator
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8089
      ADAPTER_DB_HOST: postgres
      ADAPTER_DB_PORT: 5432
      DB_HOST: postgres
      DB_PORT: 5432
      ADAPTER_DB_NAME: adapter_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhousepassword
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - netevent-network

  ott-worker:
    build:
      context: .
      dockerfile: services/workers/ott-worker/Dockerfile
    container_name: netevent-ott-worker
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8087
      DB_HOST: postgres
      DB_PORT: 5432
      NOTIFICATION_DB_NAME: notification_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      KAFKA_SERVERS: kafka:29092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - netevent-network

  notification-processor-service:
    build:
      context: .
      dockerfile: services/notification-processor-service/Dockerfile
    container_name: netevent-notification-processor
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      DB_HOST: postgres
      DB_PORT: 5432
      NOTIFICATION_DB_NAME: notification_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      KAFKA_SERVERS: kafka:29092
      BUSINESS_RULE_CREDENTIAL_ENCRYPTION_KEY: ${BUSINESS_RULE_CREDENTIAL_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - netevent-network

  notification-adapter:
    build:
      context: .
      dockerfile: services/notification-adapter/Dockerfile
    container_name: netevent-notification-adapter
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      ADAPTER_DB_NAME: adapter_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      KAFKA_SERVERS: kafka:29092
      MINI_BUSINESS_HOST: mini-business-service
      MINI_BUSINESS_PORT: 8085
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - netevent-network


networks:
  netevent-network:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
